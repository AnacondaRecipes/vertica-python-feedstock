{% set name = "vertica-python" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 542078ae2fedee694adedb04d81c6edc277b87ed7440302942107d86a0bcd445

build:
  number: 0
  skip: true # [py<37]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
  run:
    - python
    - python-dateutil >=1.5
    - six >=1.10.0

test:
  imports:
    - vertica_python
    - vertica_python.vertica
    - vertica_python.vertica.messages
    - vertica_python.vertica.messages.backend_messages
    - vertica_python.vertica.messages.frontend_messages
    - vertica_python.vertica.mixins
  source_files:
    - vertica_python/tests/unit_tests
  requires:
    - pip
    - pytest
    - mock
  commands:
    - pip check
    - pytest -v --pyargs vertica_python.tests.unit_tests

about:
  home: https://github.com/vertica/vertica-python
  license_file: LICENSE
  license: Apache-2.0
  license_family: APACHE
  summary: A native Python client for the Vertica database.
  description: |
    vertica-python is a native Python client for the Vertica (http://www.vertica.com) database.
    vertica-python is the replacement of the deprecated Python client vertica_db_client,
    which was removed since Vertica server version 9.3.
  dev_url: https://github.com/vertica/vertica-python/tree/1.4.0
  doc_url: https://github.com/vertica/vertica-python/blob/1.4.0/README.md

extra:
  recipe-maintainers:
    - pmlandwehr
